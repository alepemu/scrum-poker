# Render blueprint. One free web service building the repo's Dockerfile.
#
# The free plan sleeps after 15 minutes idle and loses its memory with it, which
# costs nothing here: rooms are disposable and a round starts with a fresh one.
# What it does cost is a cold start of roughly a minute for whoever arrives first.
services:
  - type: web
    name: scrum-poker
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      # Pinned rather than left to Render's default, so the port the app binds
      # is the one the Dockerfile EXPOSEs. server/src/config.ts reads it.
      - key: PORT
        value: 3001
