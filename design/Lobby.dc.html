<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <script src="./support.js"></script>
  </head>
  <body>
    <x-dc>
      <helmet>
        <link
          rel="stylesheet"
          href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..700&family=Public+Sans:wght@400..600&display=swap"
        />
        <style>
          body {
            margin: 0;
            min-height: 100vh;
            background: #282828;
            color: #ffffff;
            font-family: 'Public Sans', 'Helvetica Neue', Arial, sans-serif;
            font-size: 15px;
            line-height: 23px;
            -webkit-font-smoothing: antialiased;
          }
          h1,
          h2 {
            margin: 0;
            font-family: 'Bricolage Grotesque', 'Helvetica Neue', Arial, sans-serif;
            font-weight: 600;
          }
          a {
            color: #304ade;
            text-decoration: none;
          }
          a:hover {
            color: #ffffff;
          }
          button {
            font-family: inherit;
          }
        </style>
      </helmet>

      <div style="max-width: 768px; margin: 0 auto; padding: 64px 24px">
        <header
          style="
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            margin-bottom: 40px;
          "
        >
          <div>
            <h1 style="font-size: 32px; line-height: 38px; letter-spacing: -1px; color: #ffffff">
              Scrum Poker
            </h1>
            <p style="margin: 6px 0 0; font-size: 15px; line-height: 23px; color: #b5b5b5">
              Estimate together, reveal at once.
            </p>
          </div>

          <button
            type="button"
            style="
              display: flex;
              align-items: center;
              gap: 10px;
              height: 44px;
              padding: 0 14px;
              border: 1px solid #707070;
              border-radius: 4px;
              background: transparent;
              font-size: 13px;
              line-height: 20px;
              color: #ffffff;
              cursor: pointer;
            "
          >
            <span>Ada</span>
            <span style="color: #707070">Edit</span>
          </button>
        </header>

        <form
          style="
            display: flex;
            align-items: flex-end;
            gap: 12px;
            padding: 20px;
            border-radius: 8px;
            background: #3d3d3d;
          "
        >
          <div style="flex-grow: 1">
            <label
              style="
                display: block;
                margin-bottom: 8px;
                font-size: 13px;
                line-height: 20px;
                color: #b5b5b5;
              "
              >New room</label
            >
            <div
              style="
                display: flex;
                align-items: center;
                height: 44px;
                padding: 0 14px;
                border: 1px solid #707070;
                border-radius: 4px;
                background: #282828;
                font-size: 15px;
                line-height: 23px;
                color: #707070;
              "
            >
              Sprint 42 estimation
            </div>
          </div>
          <button
            type="button"
            style="
              display: inline-flex;
              align-items: center;
              justify-content: center;
              height: 44px;
              padding: 0 20px;
              border: none;
              border-radius: 4px;
              background: #304ade;
              font-size: 15px;
              line-height: 23px;
              font-weight: 600;
              color: #ffffff;
              white-space: nowrap;
              cursor: pointer;
            "
          >
            Create room
          </button>
        </form>

        <section style="margin-top: 40px">
          <h2
            style="
              margin-bottom: 14px;
              font-family: 'Public Sans', 'Helvetica Neue', Arial, sans-serif;
              font-size: 13px;
              line-height: 20px;
              font-weight: 600;
              letter-spacing: 0.08em;
              text-transform: uppercase;
              color: #b5b5b5;
            "
          >
            Open rooms
          </h2>

          <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
            <div
              style="
                display: flex;
                align-items: center;
                justify-content: space-between;
                gap: 16px;
                padding: 18px 20px;
                border: 1px solid #3d3d3d;
                border-radius: 8px;
                background: #3d3d3d;
              "
            >
              <div style="min-width: 0">
                <p
                  style="
                    margin: 0;
                    font-size: 15px;
                    line-height: 23px;
                    font-weight: 600;
                    color: #ffffff;
                  "
                >
                  Sprint 42 estimation
                </p>
                <p style="margin: 2px 0 0; font-size: 13px; line-height: 20px; color: #b5b5b5">
                  4 users
                </p>
              </div>
            </div>

            <div
              style="
                display: flex;
                align-items: center;
                justify-content: space-between;
                gap: 16px;
                padding: 18px 20px;
                border: 1px solid #304ade;
                border-radius: 8px;
                background: #3d3d3d;
              "
            >
              <div style="min-width: 0">
                <p
                  style="
                    margin: 0;
                    font-size: 15px;
                    line-height: 23px;
                    font-weight: 600;
                    color: #ffffff;
                  "
                >
                  Backlog grooming
                </p>
                <p style="margin: 2px 0 0; font-size: 13px; line-height: 20px; color: #b5b5b5">
                  3 users
                </p>
              </div>
              <span
                style="
                  flex-shrink: 0;
                  font-size: 13px;
                  line-height: 20px;
                  font-weight: 600;
                  color: #304ade;
                "
                >Join →</span
              >
            </div>

            <div
              style="
                display: flex;
                align-items: center;
                justify-content: space-between;
                gap: 16px;
                padding: 18px 20px;
                border: 1px solid #3d3d3d;
                border-radius: 8px;
                background: #3d3d3d;
              "
            >
              <div style="min-width: 0">
                <p
                  style="
                    margin: 0;
                    font-size: 15px;
                    line-height: 23px;
                    font-weight: 600;
                    color: #ffffff;
                  "
                >
                  Bug triage
                </p>
                <p style="margin: 2px 0 0; font-size: 13px; line-height: 20px; color: #b5b5b5">
                  2 users · cards up
                </p>
              </div>
            </div>

            <div
              style="
                display: flex;
                align-items: center;
                justify-content: space-between;
                gap: 16px;
                padding: 18px 20px;
                border: 1px solid #3d3d3d;
                border-radius: 8px;
                background: #3d3d3d;
              "
            >
              <div style="min-width: 0">
                <p
                  style="
                    margin: 0;
                    font-size: 15px;
                    line-height: 23px;
                    font-weight: 600;
                    color: #ffffff;
                  "
                >
                  Roadmap sizing
                </p>
                <p style="margin: 2px 0 0; font-size: 13px; line-height: 20px; color: #707070">
                  Empty
                </p>
              </div>
            </div>
          </div>
        </section>
      </div>
    </x-dc>
  </body>
</html>
