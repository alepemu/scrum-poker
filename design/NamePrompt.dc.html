<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <script src="./support.js"></script>
  </head>
  <body>
    <x-dc>
      <helmet>
        <link
          rel="stylesheet"
          href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..700&family=Public+Sans:wght@400..600&display=swap"
        />
        <style>
          body {
            margin: 0;
            min-height: 100vh;
            background: #282828;
            color: #ffffff;
            font-family: 'Public Sans', 'Helvetica Neue', Arial, sans-serif;
            font-size: 15px;
            line-height: 23px;
            -webkit-font-smoothing: antialiased;
          }
          h1,
          h2 {
            margin: 0;
            font-family: 'Bricolage Grotesque', 'Helvetica Neue', Arial, sans-serif;
            font-weight: 600;
          }
          a {
            color: #304ade;
            text-decoration: none;
          }
          a:hover {
            color: #ffffff;
          }
          button {
            font-family: inherit;
          }
        </style>
      </helmet>

      <div style="position: relative; min-height: 100vh">
        <!-- Whatever you opened — here, a room link someone shared -->
        <div style="max-width: 1024px; margin: 0 auto; padding: 36px 24px">
          <header style="margin-bottom: 40px">
            <div style="display: flex; align-items: center; gap: 12px">
              <span
                style="
                  display: grid;
                  place-items: center;
                  width: 36px;
                  height: 36px;
                  flex-shrink: 0;
                  border: 1px solid #707070;
                  border-radius: 4px;
                  color: #b5b5b5;
                "
              >
                <svg
                  width="16"
                  height="16"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  aria-hidden="true"
                >
                  <path d="M3 10.5 12 3l9 7.5"></path>
                  <path d="M5 9.5V20a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V9.5"></path>
                </svg>
              </span>
              <h1 style="font-size: 32px; line-height: 38px; letter-spacing: -1px; color: #ffffff">
                Sprint 42 estimation
              </h1>
            </div>
          </header>

          <div
            style="
              display: grid;
              grid-template-columns: auto auto auto;
              justify-items: center;
              align-items: center;
              gap: 24px 36px;
              width: fit-content;
              margin: 0 auto;
            "
          >
            <div style="grid-column: 1 / -1; display: flex; justify-content: center; gap: 28px">
              <div
                style="
                  width: 56px;
                  height: 84px;
                  border: 1px solid #707070;
                  border-radius: 8px;
                  background: #3d3d3d;
                  box-sizing: border-box;
                "
              ></div>
              <div style="width: 56px; height: 84px; border-radius: 8px; background: #304ade"></div>
              <div style="width: 56px; height: 84px; border-radius: 8px; background: #304ade"></div>
            </div>

            <div style="width: 56px; height: 84px; border-radius: 8px; background: #304ade"></div>

            <div
              style="
                display: grid;
                place-items: center;
                width: 300px;
                height: 110px;
                border-radius: 18px;
                background: radial-gradient(120% 160% at 50% 0%, #1c1c1c 0%, #000000 78%);
                box-shadow:
                  0 0 0 1px #707070,
                  inset 0 2px 30px rgb(0 0 0 / 0.75);
              "
            >
              <span
                style="
                  display: inline-flex;
                  align-items: center;
                  justify-content: center;
                  height: 48px;
                  padding: 0 28px;
                  border-radius: 4px;
                  background: #304ade;
                  font-size: 15px;
                  line-height: 23px;
                  font-weight: 600;
                  color: #ffffff;
                "
                >Reveal cards</span
              >
            </div>

            <div
              style="
                width: 56px;
                height: 84px;
                border: 1px solid #707070;
                border-radius: 8px;
                background: #3d3d3d;
                box-sizing: border-box;
              "
            ></div>

            <div style="grid-column: 1 / -1; display: flex; justify-content: center; gap: 28px">
              <div style="width: 56px; height: 84px; border-radius: 8px; background: #304ade"></div>
              <div
                style="
                  width: 56px;
                  height: 84px;
                  border: 1px solid #707070;
                  border-radius: 8px;
                  background: #3d3d3d;
                  box-sizing: border-box;
                "
              ></div>
              <div
                style="
                  width: 56px;
                  height: 84px;
                  border: 1px solid #707070;
                  border-radius: 8px;
                  background: #3d3d3d;
                  box-sizing: border-box;
                "
              ></div>
            </div>
          </div>
        </div>

        <!-- Scrim -->
        <div
          style="
            position: absolute;
            inset: 0;
            background: rgb(0 0 0 / 0.65);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
          "
        ></div>

        <!-- Nothing happens until you have a name — on any screen, not just home -->
        <div
          style="position: absolute; inset: 0; display: grid; place-items: center; padding: 16px"
        >
          <div
            style="
              width: 100%;
              max-width: 384px;
              padding: 28px;
              border: 1px solid #707070;
              border-radius: 8px;
              background: #3d3d3d;
              box-shadow: 0 24px 60px -24px rgb(0 0 0 / 0.9);
            "
          >
            <h2 style="font-size: 24px; line-height: 30px; letter-spacing: -0.5px; color: #ffffff">
              What should we call you?
            </h2>
            <p style="margin: 8px 0 24px; font-size: 15px; line-height: 23px; color: #b5b5b5">
              Your name shows on your card at the table. You can change it later from home.
            </p>

            <div
              style="
                display: flex;
                align-items: center;
                height: 44px;
                padding: 0 14px;
                border: 1px solid #304ade;
                border-radius: 4px;
                background: #282828;
                font-size: 15px;
                line-height: 23px;
                color: #707070;
              "
            >
              e.g. Ada
            </div>

            <button
              type="button"
              style="
                display: flex;
                align-items: center;
                justify-content: center;
                width: 100%;
                height: 48px;
                margin-top: 16px;
                border: none;
                border-radius: 4px;
                background: #304ade;
                font-size: 15px;
                line-height: 23px;
                font-weight: 600;
                color: #ffffff;
                cursor: pointer;
              "
            >
              Continue
            </button>
          </div>
        </div>
      </div>
    </x-dc>
  </body>
</html>
