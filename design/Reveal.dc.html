<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <script src="./support.js"></script>
  </head>
  <body>
    <x-dc>
      <helmet>
        <link
          rel="stylesheet"
          href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..700&family=Public+Sans:wght@400..600&display=swap"
        />
        <style>
          body {
            margin: 0;
            min-height: 100vh;
            background: #282828;
            color: #ffffff;
            font-family: 'Public Sans', 'Helvetica Neue', Arial, sans-serif;
            font-size: 15px;
            line-height: 23px;
            -webkit-font-smoothing: antialiased;
          }
          h1 {
            margin: 0;
            font-family: 'Bricolage Grotesque', 'Helvetica Neue', Arial, sans-serif;
            font-weight: 600;
          }
          a {
            color: #304ade;
            text-decoration: none;
          }
          a:hover {
            color: #ffffff;
          }
          button {
            font-family: inherit;
          }
        </style>
      </helmet>

      <div style="max-width: 1024px; margin: 0 auto; padding: 36px 24px">
        <header style="margin-bottom: 40px">
          <div style="display: flex; align-items: center; gap: 12px">
            <a
              href="#"
              aria-label="Home"
              title="Home"
              style="
                display: grid;
                place-items: center;
                width: 36px;
                height: 36px;
                flex-shrink: 0;
                border: 1px solid #707070;
                border-radius: 4px;
                color: #b5b5b5;
              "
            >
              <svg
                width="16"
                height="16"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <path d="M3 10.5 12 3l9 7.5"></path>
                <path d="M5 9.5V20a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V9.5"></path>
              </svg>
            </a>
            <h1 style="font-size: 32px; line-height: 38px; letter-spacing: -1px; color: #ffffff">
              Sprint 42 estimation
            </h1>
            <button
              type="button"
              aria-label="Copy link"
              title="Copy link"
              style="
                display: grid;
                place-items: center;
                width: 36px;
                height: 36px;
                flex-shrink: 0;
                border: 1px solid #707070;
                border-radius: 4px;
                background: transparent;
                color: #b5b5b5;
                cursor: pointer;
              "
            >
              <svg
                width="16"
                height="16"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <rect x="9" y="9" width="13" height="13" rx="2"></rect>
                <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
              </svg>
            </button>
          </div>
        </header>

        <!-- Cards turned over -->
        <div
          style="
            display: grid;
            grid-template-columns: auto auto auto;
            justify-items: center;
            align-items: center;
            gap: 24px 36px;
            width: fit-content;
            margin: 0 auto;
          "
        >
          <div style="grid-column: 1 / -1; display: flex; justify-content: center; gap: 28px">
            <div
              style="
                display: flex;
                flex-direction: column;
                align-items: center;
                gap: 8px;
                width: 80px;
              "
            >
              <div
                style="
                  display: grid;
                  place-items: center;
                  width: 56px;
                  height: 84px;
                  border-radius: 8px;
                  background: #ffffff;
                "
              >
                <span
                  style="
                    font-family: 'Bricolage Grotesque', 'Helvetica Neue', Arial, sans-serif;
                    font-size: 24px;
                    font-weight: 600;
                    color: #282828;
                  "
                  >2</span
                >
              </div>
              <span style="font-size: 14px; line-height: 20px; font-weight: 600; color: #ffffff"
                >Marta</span
              >
            </div>

            <div
              style="
                display: flex;
                flex-direction: column;
                align-items: center;
                gap: 8px;
                width: 80px;
              "
            >
              <div
                style="
                  display: grid;
                  place-items: center;
                  width: 56px;
                  height: 84px;
                  border: 1px dashed #707070;
                  border-radius: 8px;
                  background: #333333;
                  box-sizing: border-box;
                "
              >
                <span
                  style="
                    font-family: 'Bricolage Grotesque', 'Helvetica Neue', Arial, sans-serif;
                    font-size: 24px;
                    font-weight: 600;
                    color: #707070;
                  "
                  >–</span
                >
              </div>
              <span style="font-size: 14px; line-height: 20px; font-weight: 600; color: #707070"
                >Tom</span
              >
            </div>

            <div
              style="
                display: flex;
                flex-direction: column;
                align-items: center;
                gap: 8px;
                width: 80px;
              "
            >
              <div
                style="
                  display: grid;
                  place-items: center;
                  width: 56px;
                  height: 84px;
                  border-radius: 8px;
                  background: #ffffff;
                "
              >
                <span
                  style="
                    font-family: 'Bricolage Grotesque', 'Helvetica Neue', Arial, sans-serif;
                    font-size: 24px;
                    font-weight: 600;
                    color: #282828;
                  "
                  >5</span
                >
              </div>
              <span style="font-size: 14px; line-height: 20px; font-weight: 600; color: #ffffff"
                >Jonas</span
              >
            </div>
          </div>

          <div
            style="
              display: flex;
              flex-direction: column;
              align-items: center;
              gap: 8px;
              width: 80px;
            "
          >
            <div
              style="
                display: grid;
                place-items: center;
                width: 56px;
                height: 84px;
                border-radius: 8px;
                background: #ffffff;
              "
            >
              <span
                style="
                  font-family: 'Bricolage Grotesque', 'Helvetica Neue', Arial, sans-serif;
                  font-size: 24px;
                  font-weight: 600;
                  color: #282828;
                "
                >3</span
              >
            </div>
            <span style="font-size: 14px; line-height: 20px; font-weight: 600; color: #ffffff"
              >Priya</span
            >
          </div>

          <div
            style="
              display: grid;
              place-items: center;
              width: 300px;
              height: 110px;
              border-radius: 18px;
              background: radial-gradient(120% 160% at 50% 0%, #1c1c1c 0%, #000000 78%);
              box-shadow:
                0 0 0 1px #707070,
                inset 0 2px 30px rgb(0 0 0 / 0.75);
            "
          >
            <button
              type="button"
              style="
                display: inline-flex;
                align-items: center;
                justify-content: center;
                height: 48px;
                padding: 0 28px;
                border: 1px solid #707070;
                border-radius: 4px;
                background: transparent;
                font-size: 15px;
                line-height: 23px;
                font-weight: 600;
                color: #ffffff;
                cursor: pointer;
              "
            >
              Start new round
            </button>
          </div>

          <div
            style="
              display: flex;
              flex-direction: column;
              align-items: center;
              gap: 8px;
              width: 80px;
            "
          >
            <div
              style="
                display: grid;
                place-items: center;
                width: 56px;
                height: 84px;
                border: 1px solid #707070;
                border-radius: 8px;
                background: #3d3d3d;
                box-sizing: border-box;
              "
            >
              <span
                style="
                  font-family: 'Bricolage Grotesque', 'Helvetica Neue', Arial, sans-serif;
                  font-size: 24px;
                  font-weight: 600;
                  color: #707070;
                "
                >–</span
              >
            </div>
            <span style="font-size: 14px; line-height: 20px; font-weight: 600; color: #ffffff"
              >Lena</span
            >
          </div>

          <div style="grid-column: 1 / -1; display: flex; justify-content: center; gap: 28px">
            <div
              style="
                display: flex;
                flex-direction: column;
                align-items: center;
                gap: 8px;
                width: 80px;
              "
            >
              <div
                style="
                  display: grid;
                  place-items: center;
                  width: 56px;
                  height: 84px;
                  border-radius: 8px;
                  background: #ffffff;
                "
              >
                <span
                  style="
                    font-family: 'Bricolage Grotesque', 'Helvetica Neue', Arial, sans-serif;
                    font-size: 24px;
                    font-weight: 600;
                    color: #282828;
                  "
                  >3</span
                >
              </div>
              <span style="font-size: 14px; line-height: 20px; font-weight: 600; color: #ffffff"
                >Grace</span
              >
            </div>

            <div
              style="
                display: flex;
                flex-direction: column;
                align-items: center;
                gap: 8px;
                width: 80px;
              "
            >
              <div
                style="
                  display: grid;
                  place-items: center;
                  width: 56px;
                  height: 84px;
                  border-radius: 8px;
                  background: #ffffff;
                "
              >
                <span
                  style="
                    font-family: 'Bricolage Grotesque', 'Helvetica Neue', Arial, sans-serif;
                    font-size: 24px;
                    font-weight: 600;
                    color: #282828;
                  "
                  >3</span
                >
              </div>
              <span
                style="
                  font-size: 14px;
                  line-height: 20px;
                  font-weight: 600;
                  color: #ffffff;
                  white-space: nowrap;
                "
                >Ada <span style="color: #707070">(you)</span></span
              >
            </div>

            <div
              style="
                display: flex;
                flex-direction: column;
                align-items: center;
                gap: 8px;
                width: 80px;
              "
            >
              <div
                style="
                  display: grid;
                  place-items: center;
                  width: 56px;
                  height: 84px;
                  border: 1px solid #707070;
                  border-radius: 8px;
                  background: #3d3d3d;
                  box-sizing: border-box;
                "
              >
                <span
                  style="
                    font-family: 'Bricolage Grotesque', 'Helvetica Neue', Arial, sans-serif;
                    font-size: 24px;
                    font-weight: 600;
                    color: #707070;
                  "
                  >–</span
                >
              </div>
              <span style="font-size: 14px; line-height: 20px; font-weight: 600; color: #ffffff"
                >Rui</span
              >
            </div>
          </div>
        </div>

        <p
          style="
            margin: 14px 0 0;
            text-align: center;
            font-size: 13px;
            line-height: 20px;
            color: #707070;
          "
        >
          Cards are on the table
        </p>

        <!-- Round summary — sits exactly where your hand was before the reveal -->
        <section
          style="
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            max-width: 672px;
            margin: 40px auto 0;
            padding: 16px 20px;
            border-radius: 8px;
            background: #3d3d3d;
          "
        >
          <div style="display: flex; align-items: baseline; gap: 12px">
            <span style="font-size: 13px; line-height: 20px; color: #b5b5b5">Average</span>
            <span
              style="
                font-family: 'Bricolage Grotesque', 'Helvetica Neue', Arial, sans-serif;
                font-size: 28px;
                line-height: 34px;
                letter-spacing: -0.7px;
                font-weight: 600;
                color: #ffffff;
              "
              >3,2</span
            >
          </div>

          <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 8px">
            <div
              style="
                display: flex;
                align-items: baseline;
                gap: 8px;
                padding: 6px 12px;
                border: 1px solid #304ade;
                border-radius: 4px;
                background: rgb(48 74 222 / 0.18);
              "
            >
              <span
                style="
                  font-family: 'Bricolage Grotesque', 'Helvetica Neue', Arial, sans-serif;
                  font-size: 16px;
                  font-weight: 600;
                  color: #ffffff;
                "
                >3</span
              >
              <span style="font-size: 13px; line-height: 20px; color: #b5b5b5">×3</span>
            </div>
            <div
              style="
                display: flex;
                align-items: baseline;
                gap: 8px;
                padding: 6px 12px;
                border: 1px solid #707070;
                border-radius: 4px;
                background: #282828;
              "
            >
              <span
                style="
                  font-family: 'Bricolage Grotesque', 'Helvetica Neue', Arial, sans-serif;
                  font-size: 16px;
                  font-weight: 600;
                  color: #ffffff;
                "
                >2</span
              >
              <span style="font-size: 13px; line-height: 20px; color: #b5b5b5">×1</span>
            </div>
            <div
              style="
                display: flex;
                align-items: baseline;
                gap: 8px;
                padding: 6px 12px;
                border: 1px solid #707070;
                border-radius: 4px;
                background: #282828;
              "
            >
              <span
                style="
                  font-family: 'Bricolage Grotesque', 'Helvetica Neue', Arial, sans-serif;
                  font-size: 16px;
                  font-weight: 600;
                  color: #ffffff;
                "
                >5</span
              >
              <span style="font-size: 13px; line-height: 20px; color: #b5b5b5">×1</span>
            </div>
          </div>

          <span style="font-size: 13px; line-height: 20px; color: #707070">3 didn't vote</span>
        </section>
      </div>
    </x-dc>
  </body>
</html>
