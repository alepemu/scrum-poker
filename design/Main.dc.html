<!doctype html>
<html>

          rel="stylesheet"

            font-size: 15px;
            line-height: 23px;

                place-items: center;
                width: 36px;
                height: 36px;
                flex-shrink: 0;
                border: 1px solid #707070;
                border-radius: 4px;
                color: #b5b5b5;
              "
            >
              <svg
                width="16"
                height="16"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <path d="M3 10.5 12 3l9 7.5"></path>
                <path d="M5 9.5V20a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V9.5"></path>
              </svg>
            </a>
            <h1 style="font-size: 32px; line-height: 38px; letter-spacing: -1px; color: #ffffff">
              Sprint 42 estimation

              type="button"
              aria-label="Copy link"
              title="Copy link"

                display: grid;
                place-items: center;
                width: 36px;
                height: 36px;
                flex-shrink: 0;
                border: 1px solid #707070;
                border-radius: 4px;
                background: transparent;
                color: #b5b5b5;
                cursor: pointer;
              "
            >

                width="16"
                height="16"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"

                <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
              </svg>
            </button>
          </div>
