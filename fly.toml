# Scrum Poker. One machine, because rooms live in memory in that process —
# see server/src/store/roomStore.ts. Two machines would mean two sets of rooms.
app = 'scrum-poker'
primary_region = 'mad'

[build]

[env]
  NODE_ENV = 'production'
  PORT = '3001'

[http_service]
  internal_port = 3001
  force_https = true
  # Deliberately NOT scale-to-zero: stopping the machine drops every open room,
  # and a team that pauses for fifteen minutes would come back to an empty table.
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = 'connections'
    soft_limit = 150
    hard_limit = 200

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '10s'
    method = 'GET'
    path = '/healthz'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'
